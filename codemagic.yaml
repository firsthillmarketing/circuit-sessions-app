workflows:
  circuit-sessions-ios-app-store:
    name: Circuit Sessions iOS to App Store Connect
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: KeepClimbing ASC Key
    environment:
      ios_signing:
        provisioning_profiles:
          - cs_app_store_profile
        certificates:
          - kc_app_store_distribution
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6839234442
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate and configure iOS project
        script: bash setup-ios.sh
      - name: Apply signing profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          N=$(( (LATEST > LATEST_TF ? LATEST : LATEST_TF) + 1 ))
          cd ios/App && agvtool new-version -all $N && echo "Build number $N"
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
